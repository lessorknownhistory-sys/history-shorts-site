<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok Authorization Complete</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 640px; margin: 4rem auto; padding: 0 1.5rem; line-height: 1.6; color: #222; }
  h1 { font-size: 1.5rem; }
  code { display: block; background: #f2f2f2; padding: 1rem; border-radius: 8px; font-size: 1rem;
         word-break: break-all; margin: 1rem 0; }
  button { font-size: 0.9rem; padding: 0.5rem 1rem; cursor: pointer; }
</style>
</head>
<body>
<h1>Authorization complete</h1>
<p>Copy the code below and paste it back into the terminal running <code>upload_tiktok.py</code>.</p>
<code id="code">(reading code from URL...)</code>
<button onclick="copyCode()">Copy</button>
<p id="copied" style="color: green; display: none;">Copied.</p>
<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  document.getElementById("code").textContent = code || "No code found in URL - check the redirect worked.";
  function copyCode() {
    navigator.clipboard.writeText(code || "");
    document.getElementById("copied").style.display = "block";
  }
</script>
</body>
</html>
